[tool.poetry]
name = "tribut-ia"
version = "0.1.0"
description = "Motor Tributario Colombiano Inteligente"
authors = ["Juan Sebastian Hernandez <juansebasher@users.noreply.github.com>"]
readme = "README.md"
packages = [{include = "app", from = "backend"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = ">=0.110.0"
uvicorn = {extras = ["standard"], version = ">=0.28.0"}
pydantic = ">=2.6.0"
pyyaml = ">=6.0.1"
redis = ">=5.0.0"
python-multipart = ">=0.0.9"
httpx = ">=0.27.0"
openpyxl = ">=3.1.2"
pypdf = ">=4.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-cov = ">=5.0.0"
pytest-asyncio = ">=0.23.0"
fakeredis = ">=2.20.0"
ruff = ">=0.9.0"
mypy = ">=1.10.0"
types-pyyaml = ">=6.0.12"
types-redis = ">=4.6.0"
types-openpyxl = ">=3.1.0"
markitdown = ">=0.1.7"
graphifyy = ">=0.9.47"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".pytest_cache",
    "backend/venv",
    "backend/.pytest_cache",
    "venv",
    ".venv",
    "__pycache__",
    "frontend",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (formatter handles this)
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
mypy_path = "backend"
exclude = [
    "^backend/run\\.py$",
    "^backend/venv/",
    "^\\.venv/",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
