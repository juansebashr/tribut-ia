<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tributiaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="tributiaBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="tributiaLetter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>
    <linearGradient id="tributiaSparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="sparkleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="2" y="2" width="60" height="60" rx="15" ry="15" fill="url(#tributiaBg)" stroke="url(#tributiaBorder)" stroke-width="2.5" />

  <!-- Tax Analytics Bar Accent at Base -->
  <rect x="14" y="47" width="5" height="5" rx="1.5" fill="#38bdf8" opacity="0.6" />
  <rect x="22" y="44" width="5" height="8" rx="1.5" fill="#0284c7" opacity="0.8" />
  <rect x="30" y="41" width="5" height="11" rx="1.5" fill="#818cf8" opacity="0.9" />

  <!-- Bold Modern "T" Body -->
  <!-- Horizontal Crossbar -->
  <rect x="12" y="14" width="34" height="9" rx="3.5" fill="url(#tributiaLetter)" />
  <!-- Vertical Stem -->
  <rect x="24.5" y="19" width="9" height="28" rx="3" fill="url(#tributiaLetter)" />

  <!-- AI Star / Sparkle (Top-Right of T) -->
  <g filter="url(#sparkleGlow)">
    <path d="M47 8 Q47 16 55 16 Q47 16 47 24 Q47 16 39 16 Q47 16 47 8 Z" fill="url(#tributiaSparkle)" />
    <circle cx="47" cy="16" r="1.5" fill="#ffffff" />
  </g>

  <!-- Minor Sparkle Accent -->
  <circle cx="16" cy="33" r="1.5" fill="#38bdf8" opacity="0.85" />
</svg>