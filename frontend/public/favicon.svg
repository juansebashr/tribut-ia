<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fiscolBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="fiscolBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="fiscolLetter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="fiscolSparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="sparkleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="2" y="2" width="60" height="60" rx="15" ry="15" fill="url(#fiscolBg)" stroke="url(#fiscolBorder)" stroke-width="2.5" />

  <!-- Tax Analytics Accent Bars at Base -->
  <rect x="28" y="44" width="4.5" height="4" rx="1.5" fill="#38bdf8" opacity="0.6" />
  <rect x="35" y="41" width="4.5" height="7" rx="1.5" fill="#10b981" opacity="0.8" />
  <rect x="42" y="37" width="4.5" height="11" rx="1.5" fill="#6366f1" opacity="0.9" />

  <!-- Bold Modern "F" Body -->
  <!-- Vertical Stem -->
  <rect x="15" y="14" width="8.5" height="34" rx="3.5" fill="url(#fiscolLetter)" />
  <!-- Top Horizontal Bar -->
  <rect x="15" y="14" width="27" height="8.5" rx="3.5" fill="url(#fiscolLetter)" />
  <!-- Middle Horizontal Bar -->
  <rect x="15" y="27.5" width="19" height="7.5" rx="3" fill="url(#fiscolLetter)" />

  <!-- AI Star / Sparkle (Top-Right of F) -->
  <g filter="url(#sparkleGlow)">
    <path d="M47 8 Q47 16 55 16 Q47 16 47 24 Q47 16 39 16 Q47 16 47 8 Z" fill="url(#fiscolSparkle)" />
    <circle cx="47" cy="16" r="1.5" fill="#ffffff" />
  </g>

  <!-- Fiscal Precision Accent -->
  <circle cx="39" cy="22" r="1.5" fill="#34d399" opacity="0.9" />
</svg>